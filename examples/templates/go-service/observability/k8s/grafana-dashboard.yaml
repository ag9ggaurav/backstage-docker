apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ values.name }}-dashboard
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  ${{ values.name }}.json: |
    {
      "title": "${{ values.name }}",
      "uid": "${{ values.name }}-svc",
      "tags": ["backstage", "auto-generated", "go"],
      "refresh": "30s",
      "schemaVersion": 38,
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "current": {"value": "${{ values.namespace }}"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (rps)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(rate(${{ values.name }}_http_requests_total[5m])) by (method, path)",
            "legendFormat": "{{method}} {{path}}"
          }]
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "sum(rate(${{ values.name }}_http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(${{ values.name }}_http_requests_total[5m])) * 100",
            "legendFormat": "error %"
          }]
        },
        {
          "id": 3,
          "title": "p50 / p95 / p99 Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(${{ values.name }}_http_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(${{ values.name }}_http_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(${{ values.name }}_http_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Go Heap Memory",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "go_memstats_heap_inuse_bytes{job=\"${{ values.name }}\"}",
            "legendFormat": "heap in-use"
          }]
        },
        {
          "id": 5,
          "title": "Goroutines",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 16},
          "targets": [{
            "expr": "go_goroutines{job=\"${{ values.name }}\"}",
            "legendFormat": "goroutines"
          }]
        },
        {
          "id": 6,
          "title": "Pod Restarts",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 16},
          "targets": [{
            "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"${{ values.namespace }}\", pod=~\"${{ values.name }}-.*\"})",
            "legendFormat": "restarts"
          }]
        }
      ]
    }
