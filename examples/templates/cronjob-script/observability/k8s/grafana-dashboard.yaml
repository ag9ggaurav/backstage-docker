apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ values.name }}-cronjob-dashboard
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  ${{ values.name }}-cronjob.json: |
    {
      "title": "${{ values.name }} CronJob",
      "uid": "${{ values.name }}-cj",
      "tags": ["backstage", "auto-generated", "cronjob"],
      "refresh": "1m",
      "schemaVersion": 38,
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Last Job Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "kube_job_status_succeeded{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"}",
            "legendFormat": "succeeded"
          }],
          "options": {
            "colorMode": "background",
            "thresholds": {"steps": [{"color": "red", "value": 0}, {"color": "green", "value": 1}]}
          }
        },
        {
          "id": 2,
          "title": "Job Failures (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "sum(kube_job_failed{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"})",
            "legendFormat": "failures"
          }],
          "options": {
            "colorMode": "background",
            "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "red", "value": 1}]}
          }
        },
        {
          "id": 3,
          "title": "Job Duration (seconds)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{
            "expr": "kube_job_status_completion_time{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"} - kube_job_status_start_time{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"}",
            "legendFormat": "{{job_name}}"
          }]
        },
        {
          "id": 4,
          "title": "Active / Succeeded / Failed",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "kube_job_status_active{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"}",
              "legendFormat": "active"
            },
            {
              "expr": "kube_job_status_succeeded{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"}",
              "legendFormat": "succeeded"
            },
            {
              "expr": "kube_job_failed{namespace=\"${{ values.namespace }}\", job_name=~\"${{ values.name }}-.*\"}",
              "legendFormat": "failed"
            }
          ]
        }
      ]
    }
