apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cronjob-script-template
  title: CronJob Script
  description: Scaffolds a shell/script service running as a Kubernetes CronJob with optional observability
  tags:
    - cronjob
    - script
    - observability
spec:
  owner: user:guest
  type: service

  parameters:
    - title: CronJob Details
      required:
        - name
        - namespace
        - schedule
      properties:
        name:
          title: CronJob Name
          type: string
          description: Unique name (kebab-case, e.g. cato-admin)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        namespace:
          title: Kubernetes Namespace
          type: string
          default: default
        description:
          title: Description
          type: string
        schedule:
          title: Cron Schedule
          type: string
          default: '0 * * * *'
          description: Standard cron expression (e.g. "0 2 * * *" = daily at 2am)
        image:
          title: Base Image
          type: string
          default: alpine:3.19
          description: Docker base image for the script runner

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Observability
      properties:
        enableObservability:
          title: Enable Observability
          type: boolean
          default: false
          description: >
            Adds PrometheusRule alerts for job failures, missed schedules, and
            long-running jobs. Also creates a Grafana dashboard for job history.
            Uses kube-state-metrics (already available) — no code changes needed.
          ui:widget: checkbox
        expectedDurationMinutes:
          title: Expected Max Duration (minutes)
          type: integer
          default: 30
          description: Alert fires if job runs longer than this

  steps:
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          description: ${{ parameters.description }}
          schedule: ${{ parameters.schedule }}
          image: ${{ parameters.image | default('alpine:3.19') }}
          enableObservability: ${{ parameters.enableObservability }}

    - id: fetch-observability
      name: Add Observability
      if: ${{ parameters.enableObservability }}
      action: fetch:template
      input:
        url: ./observability
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          schedule: ${{ parameters.schedule }}
          expectedDurationSeconds: ${{ (parameters.expectedDurationMinutes | default(30)) * 60 }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
