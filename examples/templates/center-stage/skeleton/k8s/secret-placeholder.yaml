# Create the secret before deploying the workload:
#
# kubectl create secret generic ${{ values.systemKeySecretName }} \
#   --from-file=cato-system=$HOME/.ssh/cato-system \
#   -n ${{ values.secretNamespace }}
#
# Note: Pods can only mount secrets from their own namespace. If secretNamespace
# differs from the workload namespace, replicate the secret into ${{ values.namespace }}.
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.systemKeySecretName }}
  namespace: ${{ values.secretNamespace }}
type: Opaque
stringData:
  cato-system: replace-me
