apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-service-template
  title: Go Service
  description: Scaffolds a production-ready Go HTTP service with optional Prometheus observability
  tags:
    - go
    - service
    - observability
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - namespace
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for the service (kebab-case, e.g. payment-service)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        namespace:
          title: Kubernetes Namespace
          type: string
          description: Kubernetes namespace to deploy into
          default: default
        description:
          title: Description
          type: string
          description: Short description of what this service does

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Observability
      properties:
        enableObservability:
          title: Enable Observability
          type: boolean
          default: false
          description: >
            Adds Prometheus metrics (/metrics endpoint), Kubernetes ServiceMonitor,
            PrometheusRule alerts, and a Grafana dashboard to the generated service.
          ui:widget: checkbox
        metricsPort:
          title: Metrics Port
          type: integer
          default: 8080
          description: Port the service listens on (same port exposes /metrics)

  steps:
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          description: ${{ parameters.description }}
          enableObservability: ${{ parameters.enableObservability }}
          metricsPort: ${{ parameters.metricsPort | default(8080) }}

    - id: fetch-observability
      name: Add Observability
      if: ${{ parameters.enableObservability }}
      action: fetch:template
      input:
        url: ./observability
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          metricsPort: ${{ parameters.metricsPort | default(8080) }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
