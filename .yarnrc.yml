nodeLinker: node-modules

enableGlobalCache: true

# isolated-vm is a native addon used by @backstage/plugin-scaffolder-backend.
# Its build script fails in Docker (and on Apple Silicon in some environments).
# Backstage gracefully falls back to unsandboxed template execution when the
# native binary is absent, which is acceptable for this local dev deployment.
logFilters:
  - code: YN0009
    level: warning
